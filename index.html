<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>בחירת אזורים</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --sheet: var(--tg-theme-secondary-bg-color, #f2f2f7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #top { padding: 10px 12px 8px; display: flex; gap: 8px; align-items: center; }
  #search { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 0;
    background: var(--sheet); color: var(--text); font-size: 16px; outline: none; }
  #results { position: absolute; top: 52px; right: 12px; left: 12px; z-index: 1200; background: var(--bg);
    border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-height: 45vh; overflow: auto; display: none; }
  #results button { display: flex; justify-content: space-between; width: 100%; padding: 11px 14px; border: 0;
    background: none; color: var(--text); font: inherit; text-align: right; border-bottom: 1px solid var(--sheet); }
  #results small { color: var(--hint); }
  #mapwrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  #listbtn { flex: none; border: 0; border-radius: 10px; padding: 9px 12px; background: var(--sheet);
    color: var(--accent); font: inherit; font-weight: 600; }
  #list { position: absolute; inset: 0; z-index: 1100; overflow-y: auto; background: var(--bg); padding: 0 12px 12px;
    -webkit-overflow-scrolling: touch; }
  #list h3 { margin: 14px 0 4px; font-size: 13px; color: var(--hint); font-weight: 600; }
  #list .row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 4px;
    border: 0; border-bottom: 1px solid var(--sheet); background: none; color: var(--text); font: inherit; text-align: right; }
  #list .row .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hint); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--accent-text); }
  #list .row.on .mark { background: var(--accent); border-color: var(--accent); }
  #list .row.on .mark::after { content: "✓"; }
  #err { color: #d33; font-size: 12px; }
  #ver { color: var(--hint); font-size: 10px; opacity: .6; }
  #sheet { background: var(--sheet); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  #sheet-head { display: flex; justify-content: space-between; align-items: center; color: var(--hint); font-size: 13px; }
  #sheet-head button { border: 0; background: none; color: var(--accent); font: inherit; padding: 4px 0; }
  #chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 16px; padding: 6px 11px; background: var(--accent);
    color: var(--accent-text); font: inherit; font-size: 14px; white-space: nowrap; }
  .chip::after { content: " ✕"; opacity: .8; }
  #empty { color: var(--hint); font-size: 14px; padding: 8px 0 4px; }
  #save { display: none; width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; }
  .leaflet-tooltip.lbl { background: rgba(255,255,255,.85); border: 0; box-shadow: none; padding: 1px 5px;
    font-size: 11px; color: #222; border-radius: 4px; }
  .leaflet-tooltip.lbl::before { display: none; }
  #toast { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: rgba(0,0,0,.78); color: #fff; padding: 7px 14px; border-radius: 18px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="top"><input id="search" type="search" placeholder="🔍 חפש שכונה או עיר" autocomplete="off">
  <button id="listbtn" type="button">📋 רשימה</button></div>
<div id="results"></div>
<div id="mapwrap"><div id="map"></div><div id="list" hidden></div></div>
<div id="sheet">
  <div id="sheet-head"><span id="count">לחץ על שכונה במפה כדי לסמן אותה</span><button id="clear" hidden>נקה הכל</button></div>
  <div id="chips"></div>
  <button id="save">שמור</button>
  <div id="err"></div>
  <div id="ver">גרסה 3</div>
</div>
<div id="toast"></div>
<script>
// Show any error on screen, so a screenshot from the phone tells what went wrong.
function showErr(msg) { const e = document.getElementById("err"); if (e) e.textContent += "⚠️ " + msg + " "; }
window.addEventListener("error", e => showErr((e.message || "error") + (e.lineno ? " @" + e.lineno : "")));
window.addEventListener("unhandledrejection", e => showErr(String(e.reason)));
</script>
<script>
const tg = window.Telegram && Telegram.WebApp;
const inTelegram = !!(tg && tg.initData !== undefined && tg.platform && tg.platform !== "unknown");
if (tg) {
  tg.ready(); tg.expand();
  // On iPhone, Telegram treats a small finger move as "swipe down to close", which eats taps on the map.
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
}

// The bot passes the current choice as ?s=id,id (Telegram adds its own data to the #hash).
const selParam = new URLSearchParams(location.search).get("s") || new URLSearchParams(location.hash.slice(1)).get("s") || "";
const selected = new Set(selParam.split(",").filter(Boolean));
const layers = {}, props = {};
const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([32.075, 34.8], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const ACCENT = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2481cc";
function style(id) {
  const on = selected.has(id), city = props[id].kind === "city";
  return { color: on ? ACCENT : "#5b6b7c", weight: on ? 2.5 : 1, dashArray: city ? "4 4" : null,
           fillColor: on ? ACCENT : "#8aa0b6", fillOpacity: on ? 0.45 : (city ? 0.04 : 0.1) };
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 1300);
}

function toggle(id, quiet) {
  selected.has(id) ? selected.delete(id) : selected.add(id);
  layers[id].setStyle(style(id));
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e) {}
  if (!quiet) toast((selected.has(id) ? "✓ " : "הוסר: ") + label(id));
  render();
  if (!document.getElementById("list").hidden) renderList();
}

// ---- list view: the same choice without the map ----
function renderList() {
  const box = document.getElementById("list"), top = box.scrollTop;
  box.innerHTML = "";
  const order = ["תל אביב", "רמת גן", "גבעתיים"];
  const groups = {};
  Object.values(props).forEach(p => {
    const g = p.kind === "city" ? "ערים נוספות (כל העיר)" : p.city;
    (groups[g] = groups[g] || []).push(p);
  });
  Object.keys(groups).sort((a, b) => (order.indexOf(a) + 1 || 9) - (order.indexOf(b) + 1 || 9)).forEach(g => {
    const h = document.createElement("h3"); h.textContent = g; box.appendChild(h);
    groups[g].sort((a, b) => a.name.localeCompare(b.name, "he")).forEach(p => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "row" + (selected.has(p.id) ? " on" : "");
      b.innerHTML = `<span></span><span class="mark"></span>`;
      b.firstChild.textContent = p.name;
      b.onclick = () => toggle(p.id, true);
      box.appendChild(b);
    });
  });
  box.scrollTop = top;
}
document.getElementById("listbtn").onclick = () => {
  const box = document.getElementById("list"), btn = document.getElementById("listbtn");
  box.hidden = !box.hidden;
  btn.textContent = box.hidden ? "📋 רשימה" : "🗺 מפה";
  if (!box.hidden) renderList(); else map.invalidateSize();
};

function label(id) {
  const p = props[id];
  return p.kind === "city" || p.city === "תל אביב" ? p.name : `${p.name} (${p.city})`;
}

function render() {
  const ids = [...selected].filter(id => props[id]);
  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  ids.forEach(id => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label(id);
    b.onclick = () => { map.fitBounds(layers[id].getBounds(), { maxZoom: 15 }); toggle(id); };
    chips.appendChild(b);
  });
  document.getElementById("count").textContent = ids.length
    ? `נבחרו ${ids.length} אזורים` : "לא נבחר אזור, כלומר כל מקום. לחץ על שכונה כדי לסמן";
  document.getElementById("clear").hidden = !ids.length;
  const text = ids.length ? `שמור (${ids.length})` : "שמור: כל מקום";
  if (inTelegram) {
    tg.MainButton.setText(text);
    tg.MainButton.show();
  } else {
    const s = document.getElementById("save");
    s.style.display = "block"; s.textContent = text;
  }
}

function save() {
  const data = JSON.stringify({ v: 1, ids: [...selected].filter(id => props[id]) });
  if (inTelegram) tg.sendData(data);  // closes the map and sends the choice to the bot
  else alert("פתח את המפה מתוך הבוט בטלגרם כדי לשמור.\n\n" + data);
}

document.getElementById("save").onclick = save;
if (inTelegram) tg.MainButton.onClick(save);
document.getElementById("clear").onclick = () => {
  [...selected].forEach(id => { selected.delete(id); layers[id] && layers[id].setStyle(style(id)); });
  render();
};

// search
const search = document.getElementById("search"), results = document.getElementById("results");
const loose = s => s.replace(/["'`׳״\-־.,()]/g, "").replace(/\s+/g, " ").trim();
search.addEventListener("input", () => {
  const q = loose(search.value);
  results.innerHTML = "";
  if (!q) { results.style.display = "none"; return; }
  const hits = Object.values(props).filter(p =>
    loose(p.name).includes(q) || loose(p.city).includes(q) || p.keys.some(k => loose(k).includes(q))).slice(0, 12);
  hits.forEach(p => {
    const b = document.createElement("button");
    b.innerHTML = `<span>${selected.has(p.id) ? "✓ " : ""}${p.name}</span><small>${p.kind === "city" ? "כל העיר" : p.city}</small>`;
    b.onclick = () => {
      search.value = ""; results.style.display = "none"; search.blur();
      map.fitBounds(layers[p.id].getBounds(), { maxZoom: 15 });
      if (!selected.has(p.id)) toggle(p.id);
    };
    results.appendChild(b);
  });
  if (!hits.length) results.innerHTML = '<button disabled><span>לא נמצא</span></button>';
  results.style.display = "block";
});

// ---- taps: find the area under the finger ourselves ----
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inGeom(x, y, g) {
  const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  return polys.some(rings => inRing(x, y, rings[0]) && !rings.slice(1).some(h => inRing(x, y, h)));
}
function setupTaps(features) {
  const hoods = features.filter(f => f.properties.kind !== "city"), cities = features.filter(f => f.properties.kind === "city");
  const el = map.getContainer();
  let lastTap = 0;
  function tapAt(x, y, target) {
    // iPhone sends both touch and pointer events for one tap: act once.
    if (Date.now() - lastTap < 450) return;
    if (target && target.closest && target.closest(".leaflet-control")) return;
    lastTap = Date.now();
    const r = el.getBoundingClientRect();
    const ll = map.containerPointToLatLng([x - r.left, y - r.top]);
    const hit = hoods.find(f => inGeom(ll.lng, ll.lat, f.geometry)) || cities.find(f => inGeom(ll.lng, ll.lat, f.geometry));
    if (hit) toggle(hit.properties.id);
  }
  const isTap = (s, x, y) => s && Math.hypot(x - s.x, y - s.y) <= 14 && Date.now() - s.t < 700;

  // touch events (what iPhone's Telegram reliably sends)
  let tstart = null;
  el.addEventListener("touchstart", e => {
    tstart = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() } : null;
  }, { capture: true, passive: true });
  el.addEventListener("touchmove", e => {
    if (tstart && (e.touches.length > 1 || !isTap(tstart, e.touches[0].clientX, e.touches[0].clientY))) tstart = null;
  }, { capture: true, passive: true });
  el.addEventListener("touchend", e => {
    const t = e.changedTouches[0];
    if (t && isTap(tstart, t.clientX, t.clientY)) tapAt(t.clientX, t.clientY, e.target);
    tstart = null;
  }, { capture: true, passive: true });

  // pointer events (computer mouse, Android)
  let pstart = null, multi = false;
  el.addEventListener("pointerdown", e => {
    if (!e.isPrimary) { multi = true; return; }  // second finger = pinch zoom, not a tap
    multi = false;
    pstart = { x: e.clientX, y: e.clientY, t: Date.now() };
  }, true);
  el.addEventListener("pointerup", e => {
    if (e.isPrimary && !multi && isTap(pstart, e.clientX, e.clientY)) tapAt(e.clientX, e.clientY, e.target);
    pstart = null;
  }, true);
}

fetch("areas.geojson").then(r => r.json()).then(gj => {
  // whole cities first, so neighborhoods are drawn on top
  gj.features.sort((a, b) => (a.properties.kind === "city" ? 0 : 1) - (b.properties.kind === "city" ? 0 : 1));
  gj.features.forEach(f => {
    const p = f.properties; props[p.id] = p;
    // Not interactive: taps are handled below, so a slightly moving finger still counts as a tap.
    const layer = L.geoJSON(f, { style: () => style(p.id), interactive: false }).addTo(map);
    layer.bindTooltip(p.name, { permanent: true, direction: "center", className: "lbl" });
    layers[p.id] = layer;
  });
  setupTaps(gj.features);
  const showLabels = () => {
    const z = map.getZoom();
    Object.entries(layers).forEach(([id, l]) => {
      const on = props[id].kind === "city" ? z <= 13 : z >= 14 || (z >= 13 && selected.has(id));
      on ? l.openTooltip() : l.closeTooltip();
    });
  };
  map.on("zoomend", showLabels);
  const sel = [...selected].filter(id => layers[id]);
  if (sel.length) map.fitBounds(L.featureGroup(sel.map(id => layers[id])).getBounds(), { maxZoom: 14, padding: [20, 20] });
  showLabels();
  render();
}).catch(() => { document.getElementById("count").textContent = "שגיאה בטעינת המפה, נסה שוב"; });
</script>
</body>
</html>
